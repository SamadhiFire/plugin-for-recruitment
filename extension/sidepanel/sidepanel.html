<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>求职简历助手</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark"><img src="../assets/logo.svg" alt="" /></div>
      <div class="brand-copy">
        <h1>简历助手</h1>
        <p id="connection" role="status">连接中</p>
      </div>
    </header>

    <main>
      <section class="hero-card">
        <div class="section-heading">
          <div>
            <h2>填写简历</h2>
          </div>
          <button id="refreshPage" class="icon-button" disabled aria-label="重新读取当前页面" title="重新读取当前页面">↻</button>
        </div>

        <label for="profileDirection">简历方向</label>
        <select id="profileDirection">
          <option value="">请选择投递方向</option>
        </select>
        <p id="directionStatus" class="helper" hidden></p>

        <details class="instruction-disclosure">
          <summary>补充岗位要求 <span>可选</span></summary>
          <label for="autoInstruction" class="sr-only">岗位要求</label>
          <textarea id="autoInstruction" rows="3" placeholder="粘贴 JD，或说明想突出的经历"></textarea>
        </details>

        <div class="scan-actions">
          <button id="buildPlan" class="primary" disabled>分析当前页面</button>
        </div>
        <p id="planStatus" class="helper" role="status" aria-live="polite"></p>
        <span id="planCount" class="status-pill" hidden></span>
        <details id="planDiagnostics" class="diagnostics" hidden>
          <summary>分析详情</summary>
          <p id="planDiagnosticsText"></p>
        </details>
        <div id="plan" class="plan-list"></div>
        <p class="safe-note">仅填写，由你保存与提交</p>
      </section>

      <details class="tools-panel">
        <summary>工具与设置</summary>
      <details class="panel-card">
        <summary>
          <span><strong>模型设置</strong></span>
          <span id="keyStatus" class="status-pill"></span>
        </summary>
        <div class="details-body">
          <p class="helper">首次使用请双击插件目录中的“启动助手.cmd”。密钥仅保存在本机。</p>
          <label for="apiKey">千问 API Key</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="留空则保留当前密钥" />
          <label for="model">模型</label>
          <input id="model" value="qwen3.8-max" />
          <button id="saveConfig" class="quiet">保存本地设置</button>
        </div>
      </details>

      <details class="panel-card">
        <summary><span><strong>文案编辑</strong></span></summary>
        <div class="details-body">
          <label for="task">内容类型</label>
          <select id="task">
            <option value="experience">经历描述</option>
            <option value="project">项目描述</option>
            <option value="skills">专业技能</option>
            <option value="summary">个人优势</option>
          </select>
          <label for="instruction">补充要求 <span>可选</span></label>
          <textarea id="instruction" rows="3" placeholder="例如：突出海外 AI 音乐产品与增长实验"></textarea>
          <button id="compose" class="primary wide" disabled>用千问生成候选文案</button>
          <div class="inline-heading"><label for="draft">候选文案</label><span id="charCount">0 字</span></div>
          <textarea id="draft" rows="9" placeholder="生成后仍可直接编辑"></textarea>
          <div class="actions">
            <button id="copy" class="quiet">复制</button>
            <button id="fillDraft" class="primary">填入选中字段</button>
          </div>
        </div>
      </details>

      <details class="panel-card">
        <summary><span><strong>页面字段</strong></span></summary>
        <div class="details-body">
          <p id="pageInfo" class="helper">打开招聘表单后读取</p>
          <div class="actions compact">
            <button id="discover" class="quiet">重新自动分析</button>
          </div>
          <p class="helper">字段理解和复核已自动完成。分析会使用字段上下文、经历名称和简历事实；网页中的手机号、证件号码等基础字段值不发送给模型。</p>
          <div id="fields" class="field-list"></div>
        </div>
      </details>

      <details class="panel-card">
        <summary><span><strong>简历资料</strong></span></summary>
        <div class="details-body">
          <p class="helper">显示基础库与当前方向合并后的完整内容；保存时只写入当前方向差异，不影响其他方向。</p>
          <div class="actions compact"><button id="reloadProfile" class="quiet" disabled>恢复磁盘版本</button></div>
          <textarea id="profileEditor" rows="16" spellcheck="false" disabled placeholder="请先选择简历方向"></textarea>
          <button id="saveProfile" class="primary wide" disabled>保存当前方向新版本</button>
          <p id="profileStatus" class="helper"></p>
        </div>
      </details>
      <button id="rememberPage" class="text-button">记住本页补充内容</button>
      </details>
    </main>
    <footer id="fillBar" class="fill-bar" hidden>
      <span id="selectionCount"></span>
      <button id="executePlan" class="primary" disabled>确认填入</button>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
